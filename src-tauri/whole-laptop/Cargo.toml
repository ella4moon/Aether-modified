[package]
name = "aether-whole-laptop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_Console", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
regex = "1"
